[package]
name = "painel-sistema"
version = "1.0.1"
edition = "2024"
rust-version = "1.95"
description = "Agente nativo + painel web de informações do sistema"
license = "MIT"
authors = ["Luann P. <luannp91@users.noreply.github.com>"]
repository = "https://github.com/luannp91/painel-sistema"
readme = "README.md"
keywords = ["monitoring", "system-info", "dashboard", "metrics"]
categories = ["command-line-utilities", "web-programming"]

[dependencies]
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
clap = { version = "4", features = ["derive"] }
crossbeam-channel = "0.5"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
num_cpus = "1"
rust-embed = "8"
mime_guess = "2"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "2", features = ["json", "tls"] }
sha2 = "0.10"
hex = "0.4"

# Dependências por plataforma
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3

[[bin]]
name = "painel-sistema"
path = "src/main.rs"
