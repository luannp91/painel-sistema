name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex: 0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  # ==================================================
  #  Build para Windows / Linux / macOS em paralelo
  # ==================================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: painel-sistema.exe
            ext: .exe

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: painel-sistema
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: painel-sistema
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: painel-sistema
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Instalar deps Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Renomear binário
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          DEST="painel-sistema-${{ matrix.target }}${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          ls -lh "$DEST"

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: painel-sistema-${{ matrix.target }}
          path: painel-sistema-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  # ==================================================
  #  Gerar .deb e .rpm no Ubuntu
  # ==================================================
  # ==================================================
  #  Gerar .deb e .rpm no Ubuntu
  # ==================================================
  linux-packages:
    name: Pacotes Linux (.deb/.rpm)
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Baixar binário Linux
        uses: actions/download-artifact@v4
        with:
          name: painel-sistema-x86_64-unknown-linux-gnu
          path: target/release/

      - name: Preparar binário
        run: |
          mv target/release/painel-sistema-x86_64-unknown-linux-gnu target/release/painel-sistema
          chmod +x target/release/painel-sistema
          ls -lh target/release/painel-sistema

      - name: Instalar nfpm
        run: |
          NFPM_VERSION="2.41.1"
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" \
            -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          nfpm --version

      - name: Extrair versão
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Usando versão: $VERSION"

      - name: Gerar .deb
        run: |
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "painel-sistema_${{ steps.version.outputs.value }}_amd64.deb"
          ls -lh *.deb

      - name: Gerar .rpm
        run: |
          nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target "painel-sistema-${{ steps.version.outputs.value }}.x86_64.rpm"
          ls -lh *.rpm

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: painel-sistema-deb
          path: "*.deb"
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: painel-sistema-rpm
          path: "*.rpm"
          if-no-files-found: error
