name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex: 0.3.0)"
        required: true

permissions:
  contents: write

jobs:
  # ==================================================
  #  Build para Windows / Linux / macOS em paralelo
  # ==================================================
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: painel-sistema.exe
            ext: .exe

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: painel-sistema
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: painel-sistema
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: painel-sistema
            ext: ""

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Instalar deps Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libssl-dev

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Renomear binário
        shell: bash
        run: |
          SRC="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          DEST="painel-sistema-${{ matrix.target }}${{ matrix.ext }}"
          cp "$SRC" "$DEST"
          ls -lh "$DEST"

      - name: Upload artefato
        uses: actions/upload-artifact@v4
        with:
          name: painel-sistema-${{ matrix.target }}
          path: painel-sistema-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error

  # ==================================================
  #  Gerar .deb e .rpm no Ubuntu
  # ==================================================
  linux-packages:
    name: Pacotes Linux (.deb/.rpm)
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Baixar binário Linux
        uses: actions/download-artifact@v4
        with:
          name: painel-sistema-x86_64-unknown-linux-gnu
          path: target/release/

      - name: Preparar binário
        run: |
          mv target/release/painel-sistema-x86_64-unknown-linux-gnu target/release/painel-sistema
          chmod +x target/release/painel-sistema
          ls -lh target/release/painel-sistema

      - name: Instalar nfpm
        run: |
          NFPM_VERSION="2.41.1"
          curl -sfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb" \
            -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
          nfpm --version

      - name: Extrair versão
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Usando versão: $VERSION"

      - name: Gerar .deb
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          nfpm package --config packaging/nfpm.yaml --packager deb \
            --target "painel-sistema_${VERSION}_amd64.deb"
          ls -lh *.deb

      - name: Gerar .rpm
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          nfpm package --config packaging/nfpm.yaml --packager rpm \
            --target "painel-sistema-${VERSION}.x86_64.rpm"
          ls -lh *.rpm

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: painel-sistema-deb
          path: "*.deb"
          if-no-files-found: error

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: painel-sistema-rpm
          path: "*.rpm"
          if-no-files-found: error

  # ==================================================
  #  Publicar Release no GitHub (FALTAVA ESTE JOB!)
  # ==================================================
  release:
    name: Publicar Release
    runs-on: ubuntu-22.04
    needs: [build, linux-packages]
    if: always() && (needs.build.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Baixar todos os artefatos
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Preparar arquivos para o release
        run: |
          mkdir -p release-files
          # Binários compilados
          find artifacts -type f \( -name "*.exe" -o -name "painel-sistema-*" \) \
            -not -path "artifacts/*/*.txt" \
            -exec cp {} release-files/ \;
          # Pacotes Linux
          find artifacts -type f \( -name "*.deb" -o -name "*.rpm" \) \
            -exec cp {} release-files/ \; 2>/dev/null || true
          echo "Arquivos a publicar:"
          ls -lh release-files/

      - name: Definir tag/versão
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Publicando: $TAG (versão $VERSION)"

      - name: Criar Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Painel do Sistema v${{ steps.tag.outputs.version }}
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🦀 Painel do Sistema v${{ steps.tag.outputs.version }}

            ### 📦 Downloads

            | Plataforma | Arquivo |
            |------------|---------|
            | **Windows x64** | `painel-sistema-x86_64-pc-windows-msvc.exe` |
            | **Linux x64 (glibc)** | `painel-sistema-x86_64-unknown-linux-gnu` |
            | **Linux .deb** | `painel-sistema_${{ steps.tag.outputs.version }}_amd64.deb` |
            | **Linux .rpm** | `painel-sistema-${{ steps.tag.outputs.version }}.x86_64.rpm` |
            | **macOS Intel** | `painel-sistema-x86_64-apple-darwin` |
            | **macOS Apple Silicon** | `painel-sistema-aarch64-apple-darwin` |

            ### 🚀 Instalação rápida

            - **Windows:** baixe o `.exe` e execute
            - **Linux (Debian/Ubuntu):** `sudo dpkg -i painel-sistema_*_amd64.deb`
            - **Linux (Fedora/RHEL):** `sudo rpm -i painel-sistema-*.x86_64.rpm`
            - **macOS:** baixe o binário, `chmod +x` e execute

            Acesse `http://localhost:8080` após iniciar.

            ---

            **Notas completas**: veja as [releases anteriores](https://github.com/luannp91/painel-sistema/releases) ou o [README](https://github.com/luannp91/painel-sistema#readme).
