<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Painel do sistema — agente nativo em Rust"
    />
    <title>Painel do Sistema</title>

    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/layout.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/themes.css" />
    <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <div class="logo">🦀</div>
          <div class="brand-text">
            <h1>Painel do Sistema</h1>
            <p>Agente nativo Rust + dados do navegador</p>
          </div>
        </div>

        <div class="actions">
          <span class="clock" id="clock">--:--:--</span>
          <a class="btn" href="/processes.html" title="Processos"
            >⚙️ Processos</a
          >
          <a class="btn" href="/events.html" title="Eventos do sistema (logs)"
            >📋 Eventos</a
          >
          <a class="btn" href="/patterns.html" title="Padrões detectados"
            >📈 Padrões</a
          >
          <button
            class="btn ghost"
            id="btnNotifications"
            title="Notificações"
            aria-label="Notificações"
          >
            🔕
          </button>
          <button class="btn ghost" id="btnTheme" title="Alternar tema">
            🌙
          </button>
          <button class="btn" id="btnRefresh" title="Atualizar (R)">
            🔄 Atualizar
          </button>
          <button class="btn" id="btnCopy" title="Copiar (C)">📋 Copiar</button>
          <button class="btn" id="btnExport" title="Exportar (E)">
            ⬇️ Exportar
          </button>
        </div>
      </header>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>

      <main class="dashboard">
        <div id="live-cards"></div>
        <div id="browser-cards" class="grid" aria-busy="true">
          <div class="loading">
            <div class="spinner"></div>
            <p>Coletando informações do navegador…</p>
          </div>
        </div>
      </main>

      <footer class="footer">
        <p>
          Dados do SO obtidos pelo <em>agente Rust nativo</em> via
          <code>sysinfo</code>. Dados do navegador obtidos via Web APIs.
        </p>
        <p class="footer-meta">
          Coletado em <span id="collectedAt">—</span> ·
          <span id="sectionCount">0</span> categorias
        </p>
      </footer>
    </div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
